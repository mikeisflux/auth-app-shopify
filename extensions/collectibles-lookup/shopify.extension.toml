# Shopify Extension Configuration for Collectibles Lookup
api_version = "2025-10"
type = "theme"
name = "Collectibles Verification Lookup"

[[extensions.blocks]]
name = "Serial Number Lookup"
target = "section"

[extensions.blocks.settings]
[[extensions.blocks.settings.schema]]
type = "text"
id = "heading"
label = "Heading"
default = "Verify Your Collectible"

[[extensions.blocks.settings.schema]]
type = "text"
id = "subheading"
label = "Subheading"
default = "Enter the serial number to verify authenticity"

[[extensions.blocks.settings.schema]]
type = "text"
id = "button_text"
label = "Button Text"
default = "Verify"

[[extensions.blocks.settings.schema]]
type = "color"
id = "button_color"
label = "Button Color"
default = "#000000"

[[extensions.blocks.settings.schema]]
type = "checkbox"
id = "show_verification_count"
label = "Show Verification Count"
default = true