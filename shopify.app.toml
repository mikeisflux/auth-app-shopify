# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "collectible-tracker"
client_id = "YOUR_CLIENT_ID_HERE"
application_url = "https://YOUR_NGROK_URL_HERE"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "YOUR_DEV_STORE.myshopify.com"

[access_scopes]
# Required scopes for the app
scopes = "write_products,read_products,write_files,read_files,write_customers,read_customers"

[auth]
redirect_urls = [
  "https://YOUR_NGROK_URL_HERE/auth/callback",
  "https://YOUR_NGROK_URL_HERE/auth/shopify/callback",
  "https://YOUR_NGROK_URL_HERE/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/api/webhooks"

[[webhooks.subscriptions]]
topics = ["customers/data_request"]
uri = "/api/webhooks"

[[webhooks.subscriptions]]
topics = ["customers/redact"]
uri = "/api/webhooks"

[[webhooks.subscriptions]]
topics = ["shop/redact"]
uri = "/api/webhooks"

[app_proxy]
url = "https://YOUR_NGROK_URL_HERE"
subpath = "apps/collectibles"
prefix = "apps"

[pos]
embedded = false